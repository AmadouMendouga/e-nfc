plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.sultansidhu.e_nfc_new'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.sultansidhu.e_nfc_new"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
